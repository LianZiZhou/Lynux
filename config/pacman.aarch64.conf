[options]
Architecture = aarch64
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
XferCommand = /usr/local/lib/lynux/pacman-download %u %o
[core]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
[extra]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
[alarm]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

name: Verify existing image
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag (for example v2026.11.04.13.1)
        type: string
        required: true
      arch:
        description: Native image architecture
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64
      checks:
        description: Re-run all boot checks or only the Ventoy case
        type: choice
        default: all
        options:
          - all
          - ventoy
      acceleration:
        description: QEMU acceleration for controlled comparisons
        type: choice
        default: auto
        options:
          - auto
          - kvm
          - tcg
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (inputs.arch == 'aarch64' && vars.ARM_RUNNER) || (inputs.arch == 'x86_64' && vars.X86_RUNNER) || (inputs.arch == 'aarch64' && 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    environment: Testing
    timeout-minutes: 60
    env:
      ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disposable runner space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Download verified release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          python3 scripts/download-release-inputs.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --arch "$ARCH" --out out --lock work/lock
      - name: Prepare isolated test tools
        id: builder
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          bash scripts/ci-container.sh "$ARCH"
      - name: Restore ARM test firmware
        if: inputs.arch == 'aarch64'
        uses: actions/cache/restore@v4
        with:
          path: out/arm-firmware
          key: arm-firmware-${{ hashFiles('work/lock/edk2.commit', 'scripts/build-arm-firmware.sh') }}
      - name: Prepare ARM test firmware
        if: inputs.arch == 'aarch64'
        timeout-minutes: 35
        env:
          CONTAINER: ${{ steps.builder.outputs.container }}
        run: bash scripts/ci-stage.sh firmware docker exec "$CONTAINER" bash /src/scripts/build-arm-firmware.sh
      - name: Install crash debugger
        env:
          CONTAINER: ${{ steps.builder.outputs.container }}
        run: docker exec "$CONTAINER" pacman -S --needed --noconfirm gdb
      - name: Verify existing ISO without rebuilding
        env:
          CONTAINER: ${{ steps.builder.outputs.container }}
          CHECKS: ${{ inputs.checks }}
          ACCELERATION: ${{ inputs.acceleration }}
        run: |
          bash scripts/ci-stage.sh reverify docker exec -e LYNUX_QEMU_DEBUG=1 "$CONTAINER" python /src/scripts/reverify-image.py /out --arch "$ARCH" --checks "$CHECKS" --acceleration "$ACCELERATION"
      - name: Summarize verification without retaining artifacts
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Image verification\n\n')
              reports = 0
              for path in sorted(Path('out').glob(os.environ['ARCH'] + '-*.json')):
                  data = json.loads(path.read_text())
                  if 'passed' in data:
                      reports += 1
                      summary.write(f"- `{path.name}`: {'passed' if data['passed'] else 'failed'}\n")
              if not reports:
                  summary.write('No boot report was produced; see the failed step log.\n')
          PY
      - name: Clean test tools
        if: always()
        env:
          CONTAINER: ${{ steps.builder.outputs.container }}
          VOLUME: ${{ steps.builder.outputs.volume }}
        run: |
          if [[ -n "$CONTAINER" ]]; then docker rm -f "$CONTAINER"; fi
          if [[ -n "$VOLUME" ]]; then docker volume rm "$VOLUME"; fi
